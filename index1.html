<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mở Tua IC Đúc 1k2 - 3k</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
    }
    .wrap {
      width: 100%;
      max-width: 480px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      color: #38bdf8;
    }
    .sub {
      margin: 0 0 16px;
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.45;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }
    .card {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px;
    }
    .label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .val {
      font-size: 15px;
      font-weight: 700;
      color: #f87171;
    }
    .field {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    select, button {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
    }
    select {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 0 10px;
    }
    button {
      border: none;
      background: #0284c7;
      color: #ffffff;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .status-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #0f172a;
      border: 1px solid #334155;
      font-size: 14px;
      min-height: 44px;
      display: flex;
      align-items: center;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Mở Tua IC Đúc 1k2 - 3k</h1>
    <p class="sub">Kiểm tra kết nối và dò chip mở tua trên bộ IC.</p>

    <div class="grid">
      <div class="card">
        <div class="label">Nhiệt độ</div>
        <div class="val" id="tempVal">Chưa kết nối</div>
      </div>
      <div class="card">
        <div class="label">Điện áp</div>
        <div class="val" id="voltVal">Chưa kết nối</div>
      </div>
      <div class="card">
        <div class="label">Tín hiệu</div>
        <div class="val" id="sigVal">Chưa kết nối</div>
      </div>
      <div class="card">
        <div class="label">Công suất ước tính</div>
        <div class="val" id="pwrVal">Chưa kết nối</div>
      </div>
    </div>

    <div class="field">
      <label for="icSelect">Chọn IC</label>
      <select id="icSelect" aria-label="Chọn IC"></select>
    </div>

    <button type="button" id="scanBtn">Dò chip</button>

    <div class="status-box" id="statusBox">Sẵn sàng. Bấm "Dò chip" để kiểm tra.</div>
  </div>

  <script>
    (function () {
      const scanBtn = document.getElementById("scanBtn");
      const statusBox = document.getElementById("statusBox");
      let scanTimer = null;

      function setDisconnectedState() {
        document.getElementById("tempVal").textContent = "Chưa kết nối";
        document.getElementById("voltVal").textContent = "Chưa kết nối";
        document.getElementById("sigVal").textContent = "Chưa kết nối";
        document.getElementById("pwrVal").textContent = "Chưa kết nối";
      }

      setDisconnectedState();

      if (scanBtn && statusBox) {
        scanBtn.addEventListener("click", function () {
          if (scanTimer) {
            clearTimeout(scanTimer);
            scanTimer = null;
          }

          setDisconnectedState();
          scanBtn.disabled = true;
          scanBtn.textContent = "Đang dò...";
          statusBox.style.color = "#facc15";
          statusBox.textContent = "Đang dò...";

          // Thời gian chờ ngẫu nhiên từ 4000ms (4s) đến 7000ms (7s)
          const delayMs = Math.floor(Math.random() * 3001) + 4000;

          scanTimer = setTimeout(function () {
            statusBox.style.color = "#f87171";
            statusBox.textContent = "không tìm thấy chip mở tua";
            scanBtn.disabled = false;
            scanBtn.textContent = "Dò chip";
            scanTimer = null;
          }, delayMs);
        });
      }
    })();
  </script>
</body>
</html>
